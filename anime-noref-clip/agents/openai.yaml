interface:
  display_name: "Anime No-Ref Clip"
  short_description: "Machine-loadable story-style preset anime short workflow with explicit todo gate notes, boundary-group subtitles, post-TTS pacing repair, internal jump scan, and delivery gates"
  default_prompt: "Use $anime-noref-clip to turn a source anime episode into a reviewed YouTube short edit. Start with the required execution plan table, including the Visible gate / rule note column for every row, and keep todo/plan items synchronized with those gate notes. Resolve the story style from references/story_styles.json before retention artifacts; if unspecified use style_01_aggressive_youtube_cold_start, then run the style gate. Follow workflow_state gates without skipping steps, use AssemblyAI speaker diarization, mandatory GPT-5.5-low subagent visual tagging with JSONL merge/validation, dialogue/frame fusion, Story evidence pack subagent output to story_evidence_pack.json with close_agent, content-style-system task anime_clip_initial_story_write for initial_story_seed.json and canonical story_atoms.json, style-aware retention brief citing initial_story_seed, supported hook candidates, retention shot pool, contiguous source-block shot mapping, script variants citing initial_story_seed, row 11 goal naming content-style-system writing skill copywriting, content-style-system candidate review and final script copy rewrite with execution-log evidence plus initial_story_seed inheritance, creative retention QC, audited nonlinear teaser exceptions only when allowed by the resolved style, stable post-hook pacing with preset-scaled shot counts and speed ranges, local AI-tts provider profiles by default, one-shot full-script TTS with no unit audio residue, post-TTS pacing repair from real audio duration before render, stable_src_start/stable_src_end sub-windows for every used shot, safe tail buffers only inside the same stable source shot, TTS boundary table generation plus subagent boundary-id cue grouping before alignment from real TTS boundary timing such as AI-tts raw AssemblyAI word boundaries, zero boundary coverage gaps, cross-sentence subtitle bleed, or orphan fragments, per-language workflow_state and timing isolation, English 60s word budget around 130-145 words, shot-count-before-speed alignment, no clone padding except final 1-2 frames, vertical blurred-background full-frame 16:9 foreground layout centered horizontally and vertically, subtitle coordinates computed from the foreground video box and never placed in the blurred background, internal jump scan before delivery, post-render timing/layout validation, optional BGM, recorded dynamic watermark strategy, and final QA."
