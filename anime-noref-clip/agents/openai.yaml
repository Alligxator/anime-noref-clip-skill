interface:
  display_name: "Anime No-Ref Clip"
  short_description: "Retention-directed anime short workflow with explicit todo gate notes, boundary-group subtitles, post-TTS pacing repair, internal jump scan, and delivery gates"
  default_prompt: "Use $anime-noref-clip to turn a source anime episode into a reviewed YouTube short edit. Start with the required execution plan table, including the Visible gate / rule note column for every row, and keep todo/plan items synchronized with those gate notes. Follow workflow_state gates without skipping steps, use AssemblyAI speaker diarization, mandatory GPT-5.5-low subagent visual tagging with JSONL merge/validation, story atoms, retention brief, supported hook candidates, retention shot pool, contiguous source-block shot mapping, script variants, creative retention QC, audited nonlinear teaser exceptions that return to the main timeline within 6-8 seconds, stable post-hook pacing with 25-35 shots for a 60s short, fixed language voices, one-shot full-script TTS with no unit audio residue, post-TTS pacing repair from real audio duration before render, stable_src_start/stable_src_end sub-windows for every used shot, safe tail buffers only inside the same stable source shot, TTS boundary table generation plus subagent boundary-id cue grouping before alignment from real TTS WordBoundary timing, zero boundary coverage gaps, cross-sentence subtitle bleed, or orphan fragments, per-language workflow_state and timing isolation, English 60s word budget around 130-145 words, shot-count-before-speed alignment, gentle post-hook speed ranges, no clone padding except final 1-2 frames, vertical blurred-background full-frame 16:9 foreground layout centered horizontally and vertically, subtitle coordinates computed from the foreground video box and never placed in the blurred background, internal jump scan before delivery, post-render timing/layout validation, optional BGM, recorded dynamic watermark strategy, and final QA."
